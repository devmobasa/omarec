[workspace]
members = [
  "crates/omarec-core",
  "crates/omarec-protocol",
  "crates/omarec-backend-gsr",
  "crates/omarec-supervisor",
  "crates/omarecd",
  "crates/omarec-cli",
]
default-members = [
  "crates/omarecd",
  "crates/omarec-cli",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["omarec contributors"]
repository = "https://github.com/OWNER/omarec"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.24", features = ["serde", "v7"] }
rustix = { version = "1.0", features = ["net", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
