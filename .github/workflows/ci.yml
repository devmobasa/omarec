name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked --no-default-features
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --workspace --all-targets --locked --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo check --workspace --all-targets --locked --no-default-features
      - run: cargo test --workspace --all-targets --locked --no-default-features

  clippy-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo doc --workspace --no-deps --locked --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.97.1"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: jq -e -s 'length == 1' integration/quickshell/community.omarec/manifest.json >/dev/null
      - run: bash -n integration/omarchy/bin/omarchy-capture-screenrecording
      - run: bash -n integration/omarchy/bin/omarchy-capture-screenrecording-omarec
      - run: bash -n integration/omarchy/bin/omarchy-capture-screenrecording-legacy
      - run: bash -n scripts/check.sh
      - run: bash -n scripts/hardware-qualify.sh
      - run: bash -n scripts/hardware-matrix.sh
      - run: bash -n scripts/install-user.sh
      - run: bash -n scripts/static-check.sh
      - run: bash -n install-omarchy
      - run: bash -n tests/harness.sh
      - run: bash -n tests/scripts/test_validators.sh
      - run: bash tests/dispatcher/test_router.sh
      - run: bash tests/notify/test_notifier.sh
      - run: bash tests/quattro/test_watch_consumer.sh
      - run: bash tests/scripts/test_validators.sh
      - run: bash scripts/hardware-matrix.sh --check
      - run: bash scripts/static-check.sh

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n integration/arch/PKGBUILD
      - run: test -f integration/arch/omarec.install
      - run: test -f integration/systemd/omarec.service
      - run: grep -q 'ReadWritePaths=%h %t %S' integration/systemd/omarec.service
      - run: grep -q omarchy-capture-screenrecording integration/arch/PKGBUILD
      - run: grep -q community.omarec integration/arch/PKGBUILD

  hardware:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash scripts/hardware-matrix.sh --check
      - run: echo "hardware evidence is captured on packaged beta machines, not GitHub runners"
